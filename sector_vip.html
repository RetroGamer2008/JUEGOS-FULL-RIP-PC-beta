<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>/// ÁREA RESTRINGIDA - 2008 ///</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: "Courier New", monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
            cursor: url('https://cur.cursors-4u.net/windows/win-2/win22.cur'), auto !important;
            position: relative;
        }

        /* Movimiento hacia la izquierda a 12 fps */
        @keyframes scroll-left {
            0% { background-position: 0 0; }
            100% { background-position: -120px 0; }
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.pinimg.com/originals/bb/2f/b5/bb2fb57e65c333bfe00da2709e6f66a6.gif');
            background-repeat: repeat;
            background-size: 120px; 
            opacity: 0; 
            z-index: -1;
            animation: scroll-left 3s steps(12, end) infinite, bg-fps 2.5s steps(10, end) infinite;
            transition: opacity 0.3s linear;
        }

        @keyframes bg-fps {
            0% { filter: brightness(1); }
            100% { filter: brightness(1); }
        }

        #hidden-secret-btn {
            position: fixed;
            top: 2px;
            right: 5px;
            background: transparent;
            color: transparent; 
            border: none;
            font-size: 10px;
            cursor: default;
            pointer-events: none; 
            z-index: 9999;
            transition: color 0.2s;
        }

        #hidden-secret-btn.active {
            color: #050505;
            cursor: pointer;
            pointer-events: auto;
        }
        #hidden-secret-btn.active:hover {
            color: #333333;
        }

        .screen-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
        }

        #loader-wrapper {
            transition: transform 3s steps(12, end), opacity 3s steps(12, end);
            z-index: 1;
        }

        #loader-container {
            width: 350px;
            height: 25px;
            border: 2px solid #FF0000;
            background: #000000;
            padding: 2px;
            box-sizing: border-box;
            box-shadow: 0 0 10px #FF0000;
            display: block;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #FF0000;
        }

        @keyframes strict-shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 1px); }
            50% { transform: translate(3px, -1px); }
            75% { transform: translate(-1px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .shake-effect {
            animation: strict-shake 0.08s infinite;
        }

        .fall-straight-down {
            transform: translateY(100vh);
            opacity: 0;
        }

        #secret-text {
            display: none;
            font-family: "Courier New", monospace;
            font-size: 18px;
            color: #FF0000;
            text-shadow: 2px 2px #330000;
            letter-spacing: 1px;
            font-weight: bold;
            border: 1px dashed #FF0000;
            padding: 20px;
            background: rgba(17, 0, 0, 0.9);
            box-shadow: 0 0 15px #FF0000;
            max-width: 500px;
            opacity: 0;
            z-index: 1;
            transition: opacity 7s steps(12, end);
        }

        .back-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #111111;
            color: #00FFFF;
            border: 2px outset #00FFFF;
            padding: 8px 15px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: none;
            opacity: 0;
            z-index: 2;
            transition: opacity 1s steps(12, end), background-color 0.2s, color 0.2s;
        }

        .back-button:hover {
            background-color: #00FFFF;
            color: #000000;
            animation: strict-shake 0.08s infinite;
        }

        #chain-section {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* EFECTO LINTERNA */
        #flashlight-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 15;
            background: radial-gradient(circle at 50% 50%, transparent 60px, rgba(0, 0, 0, 0.96) 200px, #000000 100%);
        }

        /* ======= ZONA DE LA CAJA METÁLICA ======= */
        #box-area {
            position: absolute;
            left: 15%; 
            top: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 12;
        }
        #box-container {
            position: relative;
            width: 180px;
            height: 220px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        #box-inside, #box-door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        #box-inside { z-index: 1; }
        
        #box-door { 
            z-index: 3; 
            pointer-events: auto; /* Bloquea los clics hasta que se abra */
        }
        
        #the-key {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            z-index: 2;
            cursor: grab;
            display: none; /* Oculto hasta abrir la puerta */
            filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.8));
            user-select: none;
        }
        #the-key:active {
            cursor: grabbing;
        }
        
        #password-wrapper {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #pass-input {
            background: #111;
            color: #0F0;
            border: 1px solid #0F0;
            padding: 5px;
            font-family: "Courier New", monospace;
            text-align: center;
            width: 150px;
            outline: none;
        }
        #pass-btn {
            background: #220000;
            color: #F00;
            border: 1px solid #F00;
            cursor: pointer;
            font-family: "Courier New", monospace;
            padding: 5px;
            font-weight: bold;
        }
        #pass-btn:hover { background: #550000; }

        /* ======= ZONA DE LA CADENA ======= */
        #chain-wrapper {
            position: relative;
            width: 180px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #chain-element {
            width: 180px;
            height: auto;
            cursor: pointer;
            user-select: none;
            transform-origin: 50% 10.5%; 
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.4));
            transition: filter 0.2s;
        }
        #chain-element:hover {
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
        }

        #run-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #220000;
            color: #FF0000;
            border: 1px solid #FF0000;
            padding: 8px 15px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            opacity: 0.06;
            z-index: 20;
            transition: opacity 0.2s;
        }
        #run-button:hover {
            opacity: 0.5;
            animation: strict-shake 0.08s infinite;
        }

        .blink {
            animation: blinker 1s steps(12, end) infinite;
        }
        @keyframes blinker { 
            0%, 50% { opacity: 1; } 
            50.01%, 100% { opacity: 0; } 
        }
    </style>
</head>
<body>

    <button id="hidden-secret-btn" onclick="triggerSecretLoad()">𓁼</button>

    <div class="screen-container" id="main-screen">
        <div id="loader-wrapper">
            <div id="loader-container">
                <div id="progress-bar"></div>
            </div>
            
            <div id="estado-carga" style="color: #FF0000; font-size: 11px; margin-top: 10px;" class="blink">
                [ DESENCRIPTANDO ARCHIVOS DEL SERVIDOR... ]
            </div>
        </div>

        <div id="secret-text">Algunas cosas toman su tiempo, y tu eres muy curioso para estar aqui... :)</div>
        <a href="https://retrogamer2008.github.io/JUEGOS-FULL-RIP-PC-beta/" class="back-button" id="backBtn">&lt;&lt; VOLVER AL INICIO &gt;&gt;</a>
    </div>

    <div id="chain-section">
        <div id="flashlight-overlay"></div> 

        <!-- CAJA Y CONTRASEÑA (Usando etiquetas IMG directas) -->
        <div id="box-area">
            <div id="box-container">
                <img id="box-inside" src="385 sin título_20260822003225.jpg" draggable="false" alt="Interior Caja">
                <img id="the-key" src="385 sin título_20260822003228.png" draggable="false" alt="Llave">
                <img id="box-door" src="385 sin título_20260822003217.jpg" draggable="false" alt="Puerta Caja">
            </div>
            <div id="password-wrapper">
                <input type="text" id="pass-input" placeholder="CONTRASEÑA" autocomplete="off">
                <button id="pass-btn" onclick="verifyPassword()">INGRESAR</button>
            </div>
        </div>

        <!-- CADENA -->
        <div id="chain-wrapper">
            <img id="chain-element" src="383 sin título_20260821183227.png" alt="383 sin título" onclick="applyImpulse()" draggable="false">
        </div>
        <button id="run-button" onclick="returnToMainScreen()">correr</button>
    </div>

    <script>
        const bgStyle = document.createElement('style');
        document.head.appendChild(bgStyle);
        function setBgOpacity(val) {
            bgStyle.innerHTML = `body::before { opacity: ${val} !important; }`;
        }

        setTimeout(() => {
            startMainLoader();
        }, 5000);

        function startMainLoader() {
            const progressBar = document.getElementById('progress-bar');
            const loaderWrapper = document.getElementById('loader-wrapper');
            const estadoCarga = document.getElementById('estado-carga');
            const secretText = document.getElementById('secret-text');
            const backBtn = document.getElementById('backBtn');
            const secretBtn = document.getElementById('hidden-secret-btn');

            const totalDuration = Math.random() * (40000 - 30000) + 30000; 
            const stepsCount = 12;
            const stepTime = totalDuration / stepsCount;
            
            let currentStep = 0;
            const styleTag = document.createElement('style');
            document.head.appendChild(styleTag);

            const interval = setInterval(() => {
                currentStep++;
                let percentage = (currentStep / stepsCount) * 99;
                progressBar.style.width = percentage + '%';

                let bgOpacity = (percentage / 99) * 0.25;
                styleTag.innerHTML = `body::before { opacity: ${bgOpacity}; }`;

                if (currentStep >= stepsCount) {
                    clearInterval(interval);
                    estadoCarga.innerHTML = "[ ERROR CRÍTICO: FALLO DE SISTEMA ]";
                    loaderWrapper.classList.add('shake-effect');

                    setTimeout(() => {
                        loaderWrapper.classList.remove('shake-effect');
                        loaderWrapper.classList.add('fall-straight-down');

                        setTimeout(() => {
                            loaderWrapper.style.display = 'none';
                            secretText.style.display = 'block';
                            backBtn.style.display = 'block';
                            secretBtn.classList.add('active');

                            setTimeout(() => {
                                secretText.style.opacity = '1';
                                backBtn.style.opacity = '1';
                            }, 50);

                        }, 3000);
                    }, 2000);
                }
            }, stepTime);
        }

        function triggerSecretLoad() {
            const secretBtn = document.getElementById('hidden-secret-btn');
            if (!secretBtn.classList.contains('active') || secretBtn.dataset.clicked) return;
            secretBtn.dataset.clicked = "true";

            const mainScreen = document.getElementById('main-screen');
            mainScreen.innerHTML = `
                <div id="loader-wrapper-sec">
                    <div id="loader-container">
                        <div id="progress-bar-sec" style="width: 0%; height: 100%; background-color: #FF0000;"></div>
                    </div>
                    <div style="color: #FF0000; font-size: 11px; margin-top: 10px;" class="blink">
                        [ ACCEDIENDO AL NÚCLEO OCULTO... ]
                    </div>
                </div>
            `;

            let secStep = 0;
            let currentOpacity = 0.25; 
            const totalSteps = 12;

            const secInterval = setInterval(() => {
                secStep++;
                let p = (secStep / totalSteps) * 100;
                const barSec = document.getElementById('progress-bar-sec');
                if(barSec) barSec.style.width = p + '%';

                currentOpacity -= (0.25 / totalSteps);
                if (currentOpacity < 0) currentOpacity = 0;
                setBgOpacity(currentOpacity);

                if(secStep >= totalSteps) {
                    clearInterval(secInterval);
                    setBgOpacity(0);

                    mainScreen.style.display = 'none';
                    document.getElementById('chain-section').style.display = 'flex';
                    requestAnimationFrame(updatePendulumPhysics);
                }
            }, 250);
        }

        function returnToMainScreen() {
            document.getElementById('chain-section').style.display = 'none';
            const mainScreen = document.getElementById('main-screen');
            
            mainScreen.innerHTML = `
                <div id="loader-wrapper-back">
                    <div id="loader-container">
                        <div id="progress-bar-back" style="width: 0%; height: 100%; background-color: #FF0000;"></div>
                    </div>
                    <div style="color: #FF0000; font-size: 11px; margin-top: 10px;" class="blink">
                        [ RETORNANDO AL MENÚ PRINCIPAL... ]
                    </div>
                </div>
            `;
            mainScreen.style.display = 'flex';

            let backStep = 0;
            let currentOpacity = 0; 
            const totalSteps = 12;

            const backInterval = setInterval(() => {
                backStep++;
                let p = (backStep / totalSteps) * 100;
                const barBack = document.getElementById('progress-bar-back');
                if(barBack) barBack.style.width = p + '%';

                currentOpacity += (0.25 / totalSteps);
                if (currentOpacity > 0.25) currentOpacity = 0.25;
                setBgOpacity(currentOpacity);

                if(backStep >= totalSteps) {
                    clearInterval(backInterval);
                    setBgOpacity(0.25);

                    mainScreen.innerHTML = `
                        <div id="secret-text" style="display: block; opacity: 1;">Algunas cosas toman su tiempo, y tu eres muy curioso para estar aqui... :)</div>
                        <a href="https://retrogamer2008.github.io/JUEGOS-FULL-RIP-PC-beta/" class="back-button" id="backBtn" style="display: block; opacity: 1;">&lt;&lt; VOLVER AL INICIO &gt;&gt;</a>
                    `;

                    const secretBtn = document.getElementById('hidden-secret-btn');
                    secretBtn.classList.add('active');
                }
            }, 250);
        }

        // ============================================
        // AUDIOS PRECARGADOS
        // ============================================
        const audioClickCadena = new Audio('Cadena sonido.mp3');
        const audioAbrirCaja = new Audio('OPPEN CAJA LLAVE.mp3');
        const audioAgarrarLlave = new Audio('llave sound.mp3');
        const audioCadenaLlave = new Audio('Cadena Se abre con la llave.mp3');

        /* LÓGICA DE FÍSICAS DE LA CADENA */
        let angle = 0;
        let angularVelocity = 0;
        let gravity = 0.8;
        let damping = 0.98;

        function applyImpulse() {
            audioClickCadena.currentTime = 0;
            audioClickCadena.play().catch(e => console.log("Audio block:", e));
            angularVelocity += (Math.random() > 0.5 ? 0.18 : -0.18);
        }

        function updatePendulumPhysics() {
            const chainEl = document.getElementById('chain-element');
            if (chainEl && document.getElementById('chain-section').style.display === 'flex') {
                let angularAcceleration = (-gravity / 15) * Math.sin(angle);
                
                angularVelocity += angularAcceleration;
                angularVelocity *= damping;
                angle += angularVelocity;

                let angleDeg = angle * (180 / Math.PI);
                chainEl.style.transform = `rotate(${angleDeg}deg)`;
                requestAnimationFrame(updatePendulumPhysics);
            }
        }

        /* LÓGICA DEL EFECTO LINTERNA */
        document.addEventListener('mousemove', function(e) {
            const chainSec = document.getElementById('chain-section');
            if (chainSec.style.display === 'flex') {
                const overlay = document.getElementById('flashlight-overlay');
                const x = e.clientX;
                const y = e.clientY;
                overlay.style.background = `radial-gradient(circle at ${x}px ${y}px, transparent 60px, rgba(0, 0, 0, 0.96) 200px, #000000 100%)`;
            }
        });

        // ============================================
        // LÓGICA DE LA CAJA Y LA CONTRASEÑA
        // ============================================
        let isBoxOpen = false;
        let isChainUnlocked = false;

        function verifyPassword() {
            const passInput = document.getElementById('pass-input');
            const boxDoor = document.getElementById('box-door');
            const theKey = document.getElementById('the-key');

            if (passInput.value === 'G4m3s_F4r3v3r' && !isBoxOpen) {
                isBoxOpen = true;
                audioAbrirCaja.currentTime = 0;
                audioAbrirCaja.play().catch(e => console.log(e));
                
                // Cambia el src de la imagen directamente
                boxDoor.src = "385 sin título_20260822003221.jpg";
                // Desactiva los eventos en la puerta para que deje tocar la llave
                boxDoor.style.pointerEvents = 'none'; 
                
                theKey.style.display = 'block';

                passInput.style.borderColor = '#00FF00';
                passInput.disabled = true;
                document.getElementById('pass-btn').disabled = true;
            } else if (!isBoxOpen) {
                passInput.style.borderColor = '#FF0000';
                setTimeout(() => { passInput.style.borderColor = '#00FF00'; }, 600);
            }
        }

        // ============================================
        // LÓGICA ARRASTRE Y GRAVEDAD DE LA LLAVE
        // ============================================
        const theKey = document.getElementById('the-key');
        let isDraggingKey = false;
        let keyGravity = 0.6;
        let keyVelY = 0;
        let keyY = 0, keyX = 0;
        let keyAnimationId;

        theKey.addEventListener('mousedown', (e) => {
            if (!isBoxOpen || isChainUnlocked) return;
            isDraggingKey = true;
            cancelAnimationFrame(keyAnimationId);
            
            audioAgarrarLlave.currentTime = 0;
            audioAgarrarLlave.play().catch(e => console.log(e));

            if (theKey.style.position !== 'fixed') {
                theKey.style.position = 'fixed';
                theKey.style.transform = 'none'; 
                theKey.style.zIndex = '100';
            }
            
            updateKeyPosition(e.clientX, e.clientY);
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingKey) {
                updateKeyPosition(e.clientX, e.clientY);
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingKey) {
                isDraggingKey = false;
                keyVelY = 0; 
                keyGravityLoop(); 
            }
        });

        function updateKeyPosition(x, y) {
            keyX = x - (theKey.clientWidth / 2);
            keyY = y - (theKey.clientHeight / 2);
            theKey.style.left = keyX + 'px';
            theKey.style.top = keyY + 'px';
        }

        function keyGravityLoop() {
            if (isDraggingKey || isChainUnlocked) return;

            keyVelY += keyGravity;
            keyY += keyVelY;
            theKey.style.top = keyY + 'px';

            const chainEl = document.getElementById('chain-element');
            const chainRect = chainEl.getBoundingClientRect();
            const keyRect = theKey.getBoundingClientRect();

            if (checkCollision(keyRect, chainRect)) {
                isChainUnlocked = true;
                audioCadenaLlave.currentTime = 0;
                audioCadenaLlave.play().catch(e => console.log(e));
                
                chainEl.style.filter = "drop-shadow(0 0 20px #00FF00)";
                theKey.style.display = 'none'; 
                return;
            }

            if (keyY > window.innerHeight) {
                resetKeyToBox();
                return;
            }

            keyAnimationId = requestAnimationFrame(keyGravityLoop);
        }

        function checkCollision(r1, r2) {
            return !(r1.right < r2.left || 
                     r1.left > r2.right || 
                     r1.bottom < r2.top || 
                     r1.top > r2.bottom);
        }

        function resetKeyToBox() {
            cancelAnimationFrame(keyAnimationId);
            theKey.style.position = 'absolute';
            theKey.style.top = '50%';
            theKey.style.left = '50%';
            theKey.style.transform = 'translate(-50%, -50%)';
            theKey.style.zIndex = '2';
            keyVelY = 0;
        }

    </script>

</body>
</html>
